<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Memory Playground — Deutsch</title>
  <link rel="stylesheet" href="./dist/index.css">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    java-memory-playground {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <java-memory-playground id="de" language="de"></java-memory-playground>

  <script src="./dist/index.umd.js"></script>
  <script>
    document.getElementById('de').setAttribute('memory', JSON.stringify({
      options: { hideDeclareGlobalVariable: false },
      klasses: { Node: { attributes: { next: "Node" } } },
      objects: {},
      variables: {},
      methodCalls: {
        1: { name: "App.main", index: 0, localVariables: {}, position: { x: 0, y: 0 } }
      }
    }));
  </script>
</body>

</html>
